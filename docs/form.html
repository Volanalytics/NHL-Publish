<!doctype html><html><head><meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Form | NHL V2</title><style>
body{font-family:Arial,sans-serif;margin:0;background:#0b1220;color:#e8eef8}
header{padding:24px 32px;background:#111b2e;border-bottom:1px solid #263552}
nav a{color:#a9c7ff;margin-right:18px;text-decoration:none}
main{padding:28px 32px;max-width:1200px;margin:auto}
.card{background:#121d31;border:1px solid #263552;border-radius:12px;padding:18px;margin:14px 0}
.muted{color:#9aabc4}.ok{color:#7ee2a8}.warn{color:#ffd479}
table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #263552;text-align:left}
.grid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:12px;margin:14px 0}
.metric{background:#0e1829;border:1px solid #263552;border-radius:10px;padding:14px}
.metric b{display:block;font-size:24px}.metric span{color:#9aabc4}
.pill{font-size:13px;background:#263552;border-radius:999px;padding:3px 8px}.tablewrap{overflow-x:auto}code{color:#a9c7ff}
.gamehead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.teamblock{background:#0e1829;border:1px solid #263552;border-radius:10px;padding:14px}
.mini{display:grid;grid-template-columns:repeat(3,minmax(100px,1fr));gap:8px}
.mini span,.context span{color:#9aabc4}.mini b,.context b{color:#e8eef8}
.context{display:flex;gap:24px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:1px solid #263552}
@media(max-width:760px){.twocol{grid-template-columns:1fr}.mini{grid-template-columns:repeat(2,minmax(100px,1fr))}}
</style></head>
